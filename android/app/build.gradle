plugins { id 'com.android.application' }

android {
    namespace 'dev.viki.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'dev.viki.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/web-assets')
}

tasks.register('bundleWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'viki-personality.js', 'viki-storage.js', 'viki-notifications.js', 'manifest.json', 'assets/**'
    }
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild').configure { dependsOn 'bundleWebAssets' }

dependencies { testImplementation 'junit:junit:4.13.2' }
